# Dependabot opens weekly pull requests for the actions used in the workflows. This repository has no other
# dependencies.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # All action updates in one pull request: the CodeQL init and analyze steps must move together.
    groups:
      github-actions:
        patterns: ['*']
