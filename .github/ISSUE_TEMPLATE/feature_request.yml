name: Feature request
description: Something WAFio should do that it does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How WAFio could solve it. Leave it empty if you are not sure.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
